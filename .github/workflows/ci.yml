name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  hms-api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - name: Run Python tests
        env:
          HMS_INTEGRATION_API_KEY: test-only-ci-integration-key
        run: python -m pytest tests -n auto -q
  hms-app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/hms } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/hms/package-lock.json }
      - run: npm install
      - run: npm install @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu @napi-rs/lzma-linux-x64-gnu --no-save
      - run: npm run build
  website-frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/website/package-lock.json }
      - run: npm install
      - run: npm install @oxlint/binding-linux-x64-gnu @rolldown/binding-linux-x64-gnu @rollup/rollup-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu lightningcss-linux-x64-gnu --no-save
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  website-backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend/website } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: backend/website/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
