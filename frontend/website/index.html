<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6efe4" />
    <meta name="format-detection" content="telephone=yes" />
    <!-- Fallbacks for the dev server. scripts/prerender.mjs replaces them per route. -->
    <title data-prerender>TapMenu Grand Resort & Spa | Luxury Rooms & Dining</title>
    <meta
      data-prerender
      name="description"
      content="TapMenu Grand Resort & Spa offers comfortable luxury rooms, North Indian dining, banquet halls, and event lawns."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TapMenu Grand Resort & Spa" />
    <meta property="og:locale" content="en_IN" />
    <meta data-prerender property="og:image" content="/banner.jpeg" />
    <meta data-prerender property="og:image:width" content="1200" />
    <meta data-prerender property="og:image:height" content="630" />
    <meta data-prerender property="og:image:alt" content="TapMenu Grand Resort & Spa - Luxury rooms, restaurant, banquet hall, and lawn" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-prerender name="twitter:image" content="/banner.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
